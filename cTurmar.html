    <main>
        <section class="cadastro">
            <h1>Cadastrar turma</h1>
            <p class="subtitulo">Preencha os dados para criar uma nova turma.</p>

            <form action="/Turmas/Create" method="post">
                <div class="campo">
                    <label for="Nome">Nome da turma</label>
                    <input type="text" id="Nome" name="Nome" placeholder="Ex.: Desenvolvimento de Sistemas" required>
                </div>

                <div class="campo">
                    <label for="Ano">Ano</label>
                    <input type="text" id="Ano" name="Ano" placeholder="Ex.: 2026" maxlength="4" required>
                </div>

                <div class="acoes">
                    <a href="/Turmas" class="btn-voltar">Cancelar</a>
            <button type="button" onclick="window.location.href='index.html'">
    Cadastrar
</button>
                </div>
            </form>
        </section>
